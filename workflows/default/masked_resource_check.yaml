workflow_id: masked_resource_check
title: Masked resource workflow
description: Peer actor receives masked content and the workflow confirms that policy-backed masking does not upgrade to a violation.
enabled: true
replayable: true
actors:
  - low_user
  - peer_user
actor_sequence:
  - low_user
  - peer_user
steps:
  - step_id: ensure_low_ready
    step_type: ensure_actor_ready
    actor_id: low_user
  - step_id: low_open_masked_resource
    step_type: visit_url
    actor_id: low_user
    target: /auth_masked?doc=1
  - step_id: switch_to_peer
    step_type: switch_actor
    actor_id: peer_user
  - step_id: peer_open_masked_resource
    step_type: visit_url
    actor_id: peer_user
    target: /auth_masked?doc=1
    checkpoints:
      - checkpoint_id: peer_masked_policy
        checkpoint_type: assert_policy_outcome
        expected: masked
