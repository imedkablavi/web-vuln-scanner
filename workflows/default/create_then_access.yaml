workflow_id: create_then_access
title: Create-then-access workflow
description: Low actor creates a resource, peer actor accesses the stored resource id, and proof-backed access verification compares the same object across actors.
enabled: true
replayable: true
actors:
  - low_user
  - peer_user
actor_sequence:
  - low_user
  - peer_user
steps:
  - step_id: ensure_low_ready
    step_type: ensure_actor_ready
    actor_id: low_user
  - step_id: create_document
    step_type: api_call
    actor_id: low_user
    method: POST
    target: /workflow/documents
    input_data:
      title: Quarterly Payroll
      classification: restricted
    assertion_rules:
      body_format: json
      json_path: doc_id
    store_as: created_doc_id
  - step_id: switch_to_peer
    step_type: switch_actor
    actor_id: peer_user
  - step_id: peer_open_created_document
    step_type: visit_url
    actor_id: peer_user
    target: /workflow/documents/view_bypass?doc={created_doc_id}
    checkpoints:
      - checkpoint_id: created_doc_proof
        checkpoint_type: proof_access
        assertion_rules:
          baseline_actor_id: low_user
          parameter: doc
