notes:
  - All automated corpus network traffic binds to 127.0.0.1 on ephemeral ports.
  - Public CI never contacts public vulnerable targets, OAST services, OAuth/OIDC providers, directory services, WebSocket services, or shared caches.
  - LDAP/XPath verification is two-request semantic proof only; no writes, enumeration loops, credential guessing, or broad payload lists.
  - JWT server validation uses operator-supplied control and negative tokens from environment variables; it never forges, mutates, brute-forces, or persists raw tokens.
  - OAuth code-flow verification is credential-free/public-client only, loopback-only by default, capped at five requests, and does not persist codes/tokens/nonces.
  - WebSocket verification is handshake-only and sends zero WebSocket frames.
  - GraphQL authorization uses two explicitly configured actors and isolated request sessions; actor header values are never persisted.
  - Web cache deception uses an isolated unique query key and a separate anonymous RequestManager so ambient session cookies cannot leak into the replay.
  - HTTP desync/request-smuggling work is research-only: the fixture contains one synthetic request plus an inert trailing byte, no follow-up request, no network dispatcher, and no external target support.
  - New next-wave active verification layers are disabled by default and require explicit opt-in where they dispatch security-sensitive probes.
  - Existing experimental plugin and earlier verification safety boundaries remain unchanged.
