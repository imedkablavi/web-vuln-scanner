name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .[dev]

      - name: Compile source and local QA harnesses
        run: python -m compileall -q core layers plugins policies config workflows smoke scripts tests main_v2.py

      - name: Lint critical errors
        run: ruff check . --select E9,F63,F7,F82

      - name: Unit and regression tests
        run: python -m pytest -q

      - name: Verify helper CLIs
        run: |
          python -m core.scan_profiles passive --config config/default_config.yaml --output /tmp/passive.yaml
          python -m core.scan_profiles safe-active --config config/default_config.yaml --output /tmp/safe-active.yaml

  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Local synthetic regression corpus only
        run: |
          python -m pytest -q \
            tests/test_security_regression.py \
            tests/test_active_plugin_quality.py \
            tests/test_plugin_budget_failures.py \
            tests/test_private_scope_regression.py \
            tests/test_reporting_qa.py \
            tests/test_concurrency.py

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install smoke dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Local smoke target
        run: python smoke/run_smoke.py
      - name: Capture failed smoke report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-report
          path: smoke_out/scan_report.json
          if-no-files-found: warn
          retention-days: 3
      - name: Convert smoke report to SARIF
        run: python -m core.sarif smoke_out/scan_report.json --output smoke_out/scan_report.sarif
      - name: Validate smoke outputs contain no obvious fixture secrets
        run: |
          ! grep -R -E "(user-pass|admin-pass|top-secret-token|super-secret-cookie)" smoke_out

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Assert runtime packages and assets are shipped
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "policies/rbac_matrix_loader.py",
              "config/default_config.yaml",
              "config/rbac_matrix.yaml",
              "workflows/default/browser_only_login.yaml",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"wheel is missing required runtime assets: {missing}")
          PY
      - name: Install wheel in clean virtual environment
        run: |
          python -m venv /tmp/webvuln-package-check
          /tmp/webvuln-package-check/bin/python -m pip install --upgrade pip
          /tmp/webvuln-package-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/webvuln-package-check/bin/web-vuln-scanner --help
          /tmp/webvuln-package-check/bin/web-vuln-sarif --help
          /tmp/webvuln-package-check/bin/web-vuln-profile --help

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t web-vuln-scanner:ci .
      - name: CLI smoke inside image
        run: docker run --rm web-vuln-scanner:ci scan --help

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Local synthetic concurrency benchmark
        run: python -m scripts.benchmark_local
      - name: Show benchmark report
        run: cat benchmark_out/local-performance.json
