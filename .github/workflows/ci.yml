name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .[dev]

      - name: Compile source
        run: python -m compileall -q core layers plugins workflows smoke main_v2.py

      - name: Lint critical errors
        run: ruff check . --select E9,F63,F7,F82

      - name: Unit tests
        run: python -m pytest -q

      - name: Verify helper CLIs
        run: |
          python -m core.scan_profiles passive --config config/default_config.yaml --output /tmp/passive.yaml
          python -m core.scan_profiles safe-active --config config/default_config.yaml --output /tmp/safe-active.yaml

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Local smoke target
        run: python smoke/run_smoke.py
      - name: Convert smoke report to SARIF
        run: python -m core.sarif smoke_out/scan_report.json --output smoke_out/scan_report.sarif
