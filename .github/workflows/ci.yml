name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e '.[dev]'

      - name: Compile source
        run: python -m compileall -q core layers plugins workflows smoke main_v2.py

      - name: Lint critical errors
        run: ruff check . --select E9,F63,F7,F82

      - name: Unit tests with coverage
        run: |
          python -m pytest -q \
            --cov=core --cov=layers --cov=plugins --cov=workflows \
            --cov-report=term-missing --cov-report=xml

      - name: Verify helper CLIs
        run: |
          python -m core.scan_profiles passive --config config/default_config.yaml --output /tmp/passive.yaml
          python -m core.scan_profiles safe-active --config config/default_config.yaml --output /tmp/safe-active.yaml
          web-vuln-scanner --help
          web-vuln-profile --help
          web-vuln-sarif --help

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit pinned runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pip-audit>=2.10.1,<3'
          python -m pip_audit -r requirements.txt

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'build>=1.5,<2'
          python -m build
      - name: Install wheel in clean virtualenv
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/python -m pip install --upgrade pip
          /tmp/wheel-test/bin/python -m pip install dist/*.whl
          /tmp/wheel-test/bin/web-vuln-scanner --help
          /tmp/wheel-test/bin/web-vuln-profile --help
          /tmp/wheel-test/bin/web-vuln-sarif --help

  smoke:
    name: Authorized local smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scanner and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Local smoke target
        run: python smoke/run_smoke.py
      - name: Convert smoke report to SARIF
        run: python -m core.sarif smoke_out/scan_report.json --output smoke_out/scan_report.sarif
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence
          path: smoke_out/
          if-no-files-found: warn
          retention-days: 7

  docker:
    name: Docker build and non-root runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t web-vuln-scanner:ci .
      - name: Verify CLI starts as non-root user
        run: |
          docker run --rm web-vuln-scanner:ci --help
          docker run --rm --entrypoint sh web-vuln-scanner:ci -c 'test "$(id -u)" != "0" && touch /app/.write-test && rm /app/.write-test'
