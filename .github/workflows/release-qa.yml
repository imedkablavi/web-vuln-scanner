name: Release QA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/release-qa.yml"
      - "config/**"
      - "core/**"
      - "layers/**"
      - "plugins/**"
      - "policies/**"
      - "workflows/**"
      - "main_v2.py"

permissions:
  contents: read

jobs:
  python-package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m build
          python -m twine check dist/*
      - name: Clean wheel install smoke
        run: |
          python -m venv /tmp/wvs-wheel
          /tmp/wvs-wheel/bin/python -m pip install --upgrade pip
          /tmp/wvs-wheel/bin/python -m pip install dist/*.whl
          /tmp/wvs-wheel/bin/web-vuln-scanner --help
          /tmp/wvs-wheel/bin/web-vuln-sarif --help
          /tmp/wvs-wheel/bin/web-vuln-profile passive --output /tmp/passive-profile.yaml
          test -s /tmp/passive-profile.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  docker-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t web-vuln-scanner:ci .
      - name: Container CLI smoke
        run: docker run --rm web-vuln-scanner:ci --help
