[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-vuln-scanner"
version = "0.4.0"
description = "Scoped web assessment CLI with passive analysis and bounded active verification"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "imedkablavi" }]
keywords = ["security", "scanner", "web", "owasp", "vulnerability-assessment"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "requests>=2.34.2,<3",
  "beautifulsoup4>=4.15,<5",
  "typer>=0.27.1,<1",
  "click>=8.4.2,<9",
  "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
browser = ["playwright>=1.62,<2"]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.16.1,<1",
  "pip-audit>=2.10.1,<3",
  "build>=1.5,<2",
]

[project.scripts]
web-vuln-scanner = "core.cli:main"
web-vuln-sarif = "core.sarif:main"
web-vuln-profile = "core.scan_profiles:main"
web-vuln-diff = "core.report_diff:main"
web-vuln-har = "core.har_import:main"
web-vuln-postman = "core.postman_import:main"
web-vuln-wsdl = "core.wsdl_import:main"

[tool.setuptools]
py-modules = ["main_v2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "core*", "layers*", "plugins*", "policies*", "workflows*"]
namespaces = true

[tool.setuptools.package-data]
config = ["default_config.yaml", "safe_templates/*.yaml", "safe_templates/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["smoke_out", "reports"]