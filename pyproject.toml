[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-vuln-scanner"
version = "0.3.0"
description = "Evidence-first command-line web security scanner for authorized targets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "imedkablavi" }]
keywords = ["security", "scanner", "web", "owasp", "vulnerability-assessment"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "requests>=2.31,<3",
  "beautifulsoup4>=4.12,<5",
  "typer>=0.12,<1",
  "click>=8.1,<9",
  "PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/imedkablavi/web-vuln-scanner"
Repository = "https://github.com/imedkablavi/web-vuln-scanner"
Issues = "https://github.com/imedkablavi/web-vuln-scanner/issues"

[project.optional-dependencies]
browser = ["playwright>=1.62,<2"]
dev = [
  "build>=1.2,<2",
  "pytest>=7.4,<10",
  "ruff>=0.6,<1",
  "twine>=5,<7",
]

[project.scripts]
web-vuln-scanner = "main_v2:app"
web-vuln-sarif = "core.sarif:main"
web-vuln-profile = "core.scan_profiles:main"

[tool.setuptools]
py-modules = ["main_v2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "layers*", "plugins*", "policies*", "workflows*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["smoke_out", "reports"]
